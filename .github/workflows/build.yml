name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android Project & Permissions
        run: |
          flutter create --org com.ebhar.app --project-name ebhar_app .
          sed -i 's/android:label="ebhar_app"/android:label="إبحار"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle || true
          sed -i 's/io.flutter.embedding.android.FlutterActivity/io.flutter.embedding.android.FlutterFragmentActivity/g' android/app/src/main/AndroidManifest.xml || true
          find android/ -name "MainActivity.*" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} + || true
          sed -i '/<application/i <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-permission android:name="android.permission.USE_FINGERPRINT"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
