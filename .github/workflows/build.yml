name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android Files
        run: flutter create . --platforms android --org com.example

      # فرض compileSdk 36 و minSdk 23 على التطبيق وكافة المكتبات الخارجية
      - name: Force Android SDK 36
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          
          # حقن أمر عام لإجبار كل موديول خارجي على استخدام SDK 36
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
