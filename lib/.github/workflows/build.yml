name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create basic Android project structure
        run: |
          flutter create --platforms=android .

      - name: Add Biometric Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
