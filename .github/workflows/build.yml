name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # إنشاء ملفات أندرويد الأساسية إن كانت غير مكتملة
      - name: Ensure Android Platform Exists
        run: flutter create . --platforms android --org com.example

      # ترقية compileSdk إلى 35 و minSdk إلى 23 لحل متطلبات الحزم الجديدة
      - name: Update Android SDK Configuration
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      # بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
