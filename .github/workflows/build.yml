name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: flutter create . --platforms android --org com.example

      - name: Configure App Name and SDK
        run: |
          # 1. تغيير اسم التطبيق الذي يظهر تحت الأيقونة على شاشة الهاتف إلى "إبحار"
          sed -i 's/android:label="[^"]*"/android:label="إبحار"/g' android/app/src/main/AndroidManifest.xml || true
          
          # 2. إضافة أذونات البصمة في الـ Manifest
          sed -i '/<application/i <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>\n<uses-permission android:name="android.permission.USE_FINGERPRINT"\/>' android/app/src/main/AndroidManifest.xml || true
          
          # 3. ترقية النشاط الرئيسي ليدعم البصمة (FlutterFragmentActivity)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/com/example/ebhar_app/MainActivity.kt 2>/dev/null || true
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/java/com/example/ebhar_app/MainActivity.java 2>/dev/null || true

          # 4. ضبط إصدارات الأندرويد المطلوبة
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle || true
          
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons || true

      - name: Build Android App via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-debug
          path: "**/build/**/outputs/**/*.apk"
          if-no-files-found: error
