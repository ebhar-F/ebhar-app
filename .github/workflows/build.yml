name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: flutter create . --platforms android --org com.example

      # ضبط التوافقية الشاملة على SDK 36
      - name: Configure Android SDK
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 23/g' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle || true
          
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      # بناء ملف APK وتجاوز فحص مسار Flutter الداخلي
      - name: Build Android App via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # التقاط ملف الـ APK تلقائياً ورفعه من أي مسار تم إنشاؤه فيه
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebhar-app-debug
          path: "**/build/**/outputs/**/*.apk"
          if-no-files-found: error
